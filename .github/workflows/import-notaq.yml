name: Import Notaq portfolio source

on:
  push:
    branches: [main]
    paths:
      - notaq-portfolio-source.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source archive
        if: ${{ hashFiles('notaq-portfolio-source.zip') != '' }}
        run: |
          unzip -o notaq-portfolio-source.zip
          rm notaq-portfolio-source.zip

      - name: Commit imported project
        if: ${{ hashFiles('notaq-portfolio-source.zip') == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import Notaq portfolio project"
          git push
