name: Import Notaq portfolio source

on:
  push:
    branches: [main]
    paths:
      - 'notaq-source.part-*'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and extract source archive
        run: |
          cat notaq-source.part-* > /tmp/notaq-portfolio-source.zip
          unzip -o /tmp/notaq-portfolio-source.zip
          rm notaq-source.part-*

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Notaq portfolio project"
          git push
